<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>My To-Do List</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Enter a new task..." maxlength="100">
      <button id="addBtn" class="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <p id="message" class="message"></p>

    <ul id="taskList" class="task-list"></ul>

    <p id="counter" class="counter">No tasks yet. Add your first task above.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
